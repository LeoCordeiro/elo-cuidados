[build]
  command = "npm run build"
  publish = "dist"

# O roteamento e por hash (createWebHashHistory), entao o servidor so precisa
# entregar o index.html da raiz — nao ha rota de servidor para reescrever.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
